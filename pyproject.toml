[project]
name = "dispatch-training"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pymysql>=1.1,<2",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
