services:
  training-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dispatch_training
      MYSQL_USER: training_app
      MYSQL_PASSWORD: ${TRAINING_DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${TRAINING_DB_ROOT_PASSWORD:-change_root_me}
    ports:
      - "3307:3306"
    volumes:
      - dispatch_training_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  dispatch_training_mysql:
